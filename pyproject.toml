[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurowalker"
version = "0.1.0"
description = "Simulated 18-DOF hexapod with a connectome-inspired spiking controller, benchmarked against PPO and a tripod CPG. Simulation only."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "mujoco>=3.1", "gymnasium", "matplotlib", "imageio", "imageio-ffmpeg", "pyyaml", "psutil", "cma"]

[project.optional-dependencies]
rl = ["torch", "stable-baselines3", "tensorboard"]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741", "E501", "E701", "E702", "E731"]  # dense research-script style

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slower tests excluded from CI"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["I001"]
